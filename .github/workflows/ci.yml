name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Kept in step with the Dockerfile.
  UV_VERSION: "0.12.16"
  NODE_VERSION: "22"
  GITLEAKS_VERSION: "8.30.1"

jobs:
  security:
    name: Secrets and vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks scans the history, not only the last commit.
          fetch-depth: 0
      # A downloaded, checksum-verified binary instead of a marketplace action: nothing about it can change under us.
      - name: Install gitleaks
        run: |
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSL -o "$asset" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${asset}"
          curl -sSL -o checksums.txt "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep "$asset" checksums.txt | sha256sum -c -
          tar -xzf "$asset" gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
      # .gitleaks.toml allows only the made-up values the tests use.
      - name: Scan for secrets
        run: gitleaks detect --source . --config .gitleaks.toml --no-banner --redact
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Python dependencies with known vulnerabilities
        working-directory: backend
        run: |
          uv export --frozen --all-extras --no-dev --no-hashes --no-emit-project > /tmp/requirements.txt
          uvx pip-audit --strict -r /tmp/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: npm dependencies with known high or critical vulnerabilities
        run: npm audit --audit-level=high --omit=dev

  backend:
    name: Backend (${{ matrix.database }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgresql]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tower
          POSTGRES_PASSWORD: tower
          POSTGRES_DB: tower
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tower -d tower"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install
        working-directory: backend
        run: uv sync --locked --all-extras
      - name: Lint
        if: matrix.database == 'sqlite'
        working-directory: backend
        run: uv run ruff check app tests ../tools ../plugins ../examples
      - name: Types
        if: matrix.database == 'sqlite'
        working-directory: backend
        run: uv run mypy app
      - name: Tests
        working-directory: backend
        env:
          TEST_DATABASE_URL: ${{ matrix.database == 'postgresql' && 'postgresql://tower:tower@localhost:5432/tower' || '' }}
        run: uv run pytest -q

  admin:
    name: Admin app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: The admin's API types match the server
        run: |
          npm run api
          git diff --exit-code -- admin/openapi.json admin/src/schema.d.ts \
            || { echo "::error::Routes changed without regenerating the admin's types: run 'npm run api' and commit."; exit 1; }
      - name: Type-check and build
        run: npm run build

  scripts:
    name: Shell scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: shellcheck --severity=warning install.sh scripts/*.sh scripts/check-container/*.sh deploy/*.sh

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  signoff:
    name: Commits are signed off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The CLA (CLA.md) is accepted with a Signed-off-by line on every commit: `git commit -s`.
      - name: Every commit has a Signed-off-by line
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$sha" | grep -qiE '^Signed-off-by: .+ <.+@.+>'; then
              echo "::error::Commit $(git log -1 --format='%h %s' "$sha") has no Signed-off-by line."
              missing=1
            fi
          done
          if [ "$missing" = 1 ]; then
            echo "Sign off your commits to accept the CLA: git commit -s (or git rebase --signoff $BASE, then push --force-with-lease)."
            exit 1
          fi
