[project]
name = "control-tower"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic-settings>=2,<3",
  "sqlalchemy>=2,<3",
  "alembic>=1.14,<2",
  "httpx>=0.28,<1",
  "python-multipart>=0.0.32",
  "pypdf>=6.19.0",
  "google-genai>=1.30,<3",
  "argon2-cffi>=23,<26",
  "cryptography>=43",
  "nh3>=0.2,<1",
  "email-validator>=2,<3",
  "tzdata>=2026.4",
  "redis>=5,<7",
  "segno>=1.6,<2",
  "pillow>=13,<14",
  "reportlab>=4.2,<5",
  # The video studio joins scenes with ffmpeg; this wheel brings its own ffmpeg binary.
  "imageio-ffmpeg>=0.5,<1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
mysql = ["pymysql[rsa]>=1.1,<2"]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.11,<1",
    "mypy>=1.15,<2",
    "pytest-asyncio>=0.24,<2",
    "aiosmtpd>=1.4,<2",
    "types-python-dateutil>=2.9.0.20260807",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Listed explicitly. Ruff's own default set changes between versions — 0.16
# switches on 400+ rules — and a check that moves under a project is not one
# anybody can plan for. These catch real defects: undefined names and unused
# imports (F), likely bugs (B), security mistakes (S), exceptions swallowed
# whole (BLE), async misuse (ASYNC), plus import order (I) and outdated syntax
# (UP), which `ruff check --fix` corrects on its own.
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "S", "BLE", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# `assert` is how pytest tests are written.
"tests/**" = ["S101"]
# conftest.py sets the test environment before importing the app, on purpose:
# configuration is read once, so the imports have to come after it.
"conftest.py" = ["S101", "E402"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# reportlab ships no type information (letters, services/letters/pdf.py).
module = ["reportlab", "reportlab.*"]
ignore_missing_imports = true

[tool.uv]
package = false
